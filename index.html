<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Mardamind — reading, journals, tutorials, and books.">
  <meta name="theme-color" content="#ffffff">
  <title>Mardamind</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #ffffff;
      color: #171717;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 680px; margin: 0 auto; padding: 64px 24px 48px; }
    header { display: flex; align-items: center; gap: 18px; padding-bottom: 28px; border-bottom: 1px solid #e5e5e7; }
    .portrait { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    h1 { font-size: 38px; font-weight: 700; letter-spacing: -1.3px; line-height: 1.2; margin: 0; }
    .intro { margin: 30px 0 32px; color: #606064; font-size: 18px; line-height: 1.6; }
    .links { display: flex; flex-direction: column; }
    .link { display: block; padding: 25px 12px; color: inherit; text-decoration: none; }
    .link + .link { border-top: 1px solid #e5e5e7; }
    .title { display: block; font-size: 21px; font-weight: 600; line-height: 1.4; }
    .address { display: block; margin-top: 7px; color: #757579; font-size: 15px; line-height: 1.5; overflow-wrap: anywhere; }
    .link:hover .title { color: #0066cc; }
    .link:focus-visible { outline: 2px solid #0066cc; outline-offset: -2px; border-radius: 4px; }
    @media (max-width: 480px) {
      main { padding: 34px 22px 32px; }
      header { gap: 14px; padding-bottom: 24px; }
      .portrait { width: 52px; height: 52px; }
      h1 { font-size: 32px; letter-spacing: -1px; }
      .intro { font-size: 16px; margin: 26px 0 22px; }
      .link { padding: 23px 4px; }
      .title { font-size: 19px; }
      .address { font-size: 14px; }
    }
  </style>
